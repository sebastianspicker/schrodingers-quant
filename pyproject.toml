[project]
name = "schrodingers-quant"
version = "0.1.0"
description = "A reproducible spot-trading experiment built on Freqtrade."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
# The code runs on the pinned Freqtrade image's Python and, for ops/, on
# Debian 13's system Python (3.13). Neither is guaranteed to be 3.14, so the
# formatter and the pyupgrade rules must not introduce 3.14-only syntax such
# as `except A, B:` without parentheses (PEP 758). See ADR-0006.
target-version = "py313"
line-length = 100
# Import roots: the project package, Freqtrade strategies, and host scripts.
src = ["src", "user_data/strategies", "ops"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import roots for the tests: the project package, the Freqtrade strategies
# (loaded through tests/conftest.py's minimal IStrategy stand-in when the real
# Freqtrade is absent) and the host scripts.
pythonpath = ["src", "user_data/strategies", "ops"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:sq", "error::FutureWarning"]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    # Unit tests of the pure research, live-tooling and ops logic run on the
    # development machine without Docker; Freqtrade itself is never a dev
    # dependency (the pinned image is the only Freqtrade runtime).
    "pytest>=8.3",
    "pandas>=2.2,<4",
    "numpy>=1.26",
]
